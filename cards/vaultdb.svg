<svg xmlns="http://www.w3.org/2000/svg" width="430" height="178" viewBox="0 0 430 178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><style>@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:none}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.rise{animation:rise .5s ease-out both}.fade{animation:fade .6s ease-out both}.pop{animation:pop .5s ease-out both;transform-box:fill-box;transform-origin:center}.grow{animation:grow .6s ease-out both;transform-box:fill-box;transform-origin:bottom}.k{animation:blink 1s step-end infinite}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111722"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs><rect width="430" height="178" rx="12" fill="url(#bg)"/><rect x=".5" y=".5" width="429" height="177" rx="12" fill="none" stroke="#30363d"/><line x1="0" y1="30" x2="430" y2="30" stroke="#30363d"/><circle cx="20" cy="15.0" r="5" fill="#ff5f56"/><circle cx="36" cy="15.0" r="5" fill="#ffbd2e"/><circle cx="52" cy="15.0" r="5" fill="#27c93f"/><text x="215.0" y="19.0" fill="#7d8590" font-size="12" text-anchor="middle">~/vaultdb $ cat README</text><text x="22" y="62" fill="#e6edf3" font-size="18" font-weight="bold" class="rise" style="animation-delay:0.15s">VaultDB</text><text x="408" y="61" fill="#7d8590" font-size="11" text-anchor="end" class="fade" style="animation-delay:0.25s">github.com/ABDULRAIYAAN/vaultdb</text><text x="22" y="88" fill="#c9d1d9" font-size="12" class="fade" style="animation-delay:0.30s">A database built from scratch in Go: crash-safe log,</text><text x="22" y="106" fill="#c9d1d9" font-size="12" class="fade" style="animation-delay:0.36s">B-tree index, SQL, TCP server and HNSW vector search.</text><text x="22" y="124" fill="#c9d1d9" font-size="12" class="fade" style="animation-delay:0.42s">Runs in your browser via WebAssembly.</text><line x1="0" y1="138" x2="430" y2="138" stroke="#30363d"/><g class="fade" style="animation-delay:0.50s"><circle cx="27" cy="154" r="5.5" fill="#00ADD8"/><text x="38" y="158" fill="#c9d1d9" font-size="12">Go</text><rect x="70.4" y="144" width="73.4" height="19" rx="9.5" fill="none" stroke="#30363d"/><text x="107.1" y="157.5" fill="#39d353" font-size="11" text-anchor="middle">databases</text><rect x="149.8" y="144" width="60.2" height="19" rx="9.5" fill="none" stroke="#30363d"/><text x="179.9" y="157.5" fill="#39d353" font-size="11" text-anchor="middle">systems</text><rect x="216.0" y="144" width="40.4" height="19" rx="9.5" fill="none" stroke="#30363d"/><text x="236.2" y="157.5" fill="#39d353" font-size="11" text-anchor="middle">wasm</text></g></svg>