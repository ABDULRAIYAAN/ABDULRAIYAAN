name: Update profile art

# Refreshes the contribution heatmap daily from real GitHub data.

"on":
  schedule:
    - cron: "17 22 * * *"   # 06:17 Malaysia time
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py

      - name: Render heatmap and monthly activity
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/render_activity_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg activity.svg"
